name: release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      replace_release:
        description: Replace the existing version release after both packages pass qualification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content DuplicateVideoCleaner/DuplicateVideoCleaner.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid project version.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must match the project version.'
          }
      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is required.' }
          "DVC_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Validate and build release with pinned FFmpeg
        shell: pwsh
        run: |
          ./build/Test-BuildScripts.ps1
          ./build/BuildRelease.ps1 -InnoSetupCompiler $env:DVC_ISCC
      - name: Qualify exact setup in hosted VM
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $previous = Join-Path $env:RUNNER_TEMP 'DuplicateVideoCleaner-1.1.1-win-x64-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/Softhe/Duplicate-Video-Cleaner/releases/download/v1.1.1/DuplicateVideoCleaner-1.1.1-win-x64-setup.exe' -OutFile $previous
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash -ne 'A7766E7FAE119E246ABB69F36A891581F714946832D386FB3064CF24CF243030') { throw 'Previous installer hash mismatch.' }
          $setups = @(Get-ChildItem release/*-setup.exe)
          if ($setups.Count -ne 1) { throw 'Expected one candidate setup.' }
          ./build/Test-InstalledSetup.ps1 -SetupPath $setups[0].FullName -PreviousSetupPath $previous -RequireVirtualMachine -RunUiTests -EvidencePath release/installer-acceptance.json
          ./build/Assert-ReleaseAcceptance.ps1 -SetupPath $setups[0].FullName -EvidencePath release/installer-acceptance.json
      - name: Qualify portable package in hosted VM
        timeout-minutes: 5
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem release/*-portable.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one portable ZIP.' }
          ./build/Test-PortablePackage.ps1 -ArchivePath $archives[0].FullName -RequireVirtualMachine -RunUiTests -EvidencePath release/portable-acceptance.json
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-evidence
          path: |
            release/installer-acceptance.json
            release/portable-acceptance.json
            release/acceptance-evidence/**
            **/TestResults/*.trx
          if-no-files-found: warn
      - name: Stage installer, portable package and checksums
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem release/*-setup.exe)
          $archives = @(Get-ChildItem release/*-portable.zip)
          if ($setups.Count -ne 1 -or $archives.Count -ne 1) { throw 'Expected one setup EXE and one portable ZIP.' }
          New-Item -ItemType Directory release/publish-assets | Out-Null
          $lines = foreach ($asset in @($setups[0], $archives[0])) {
            Copy-Item -LiteralPath $asset.FullName -Destination release/publish-assets
            '{0}  {1}' -f (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash, $asset.Name
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'release/publish-assets/SHA256SUMS.txt'), $lines)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: release/publish-assets/*
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag' || inputs.replace_release == true
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: release
      - name: Replace existing release when explicitly requested
        if: inputs.replace_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Replacement releases must use main.' >&2
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          gh release view "$tag" --repo "$GH_REPO" >/dev/null
          gh release delete "$tag" --repo "$GH_REPO" --yes
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*-setup.exe
            release/*-portable.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
